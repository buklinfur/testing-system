format_version: 1
slug: check-broken-checker
title: { ru: "Проверка: чекер не компилируется" }
type: batch

# Тестовый пакет сессии 4а.4: свой чекер с синтаксической ошибкой — версия failed, эталоны не запускаются.
io: { mode: stdio }
limits:
  time_ms: 500
  memory_mb: 256
languages: [python, cpp]
checker: { type: custom, path: checker/check.cpp }
feedback: first_fail

test_groups:
  - name: samples
    tests: "tests/sample*.in"
    points: 0
    visibility: open
  - name: main
    tests: "tests/main*.in"
    points: 100
    scoring: all_or_nothing
    visibility: hidden

solutions:
  - { path: solutions/ok.py, expect: OK }
